name: CI

on:
  push:
    branches: [main]
  # Every PR, not just those targeting main. Stacked branches are how this repo
  # actually gets worked on, and restricting to `main` meant a run of PRs merged
  # without CI ever having looked at them.
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo · format · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install` (not `npm ci`): the workspace lockfile is refreshed on the
      # first networked install after the monorepo/web app were added.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Repo-wide formatting, which is the only thing left at the root now the
      # Expo app is gone. Each workspace runs its own typecheck/lint/tests below.
      - name: Format check
        run: npm run format:check
      - name: Lint (root)
        run: npm run lint

  core:
    name: core · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck (@tfc/core)
        run: npm run typecheck --workspace @tfc/core
      # Coverage rather than a plain run: the threshold in jest.config.js is the
      # thing that fails, and it only fails if coverage is actually collected.
      - name: Test with coverage (@tfc/core)
        run: npm run test:coverage --workspace @tfc/core
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: packages/core/coverage/
          if-no-files-found: ignore
      # Runners are UTC, where UTC-vs-local day bugs pass silently. Day
      # arithmetic drives streaks, rest rules, and "today", so re-run the suite
      # west of and east of Greenwich.
      - name: Test (@tfc/core, UTC-7)
        run: TZ=America/Los_Angeles npm run test --workspace @tfc/core
      - name: Test (@tfc/core, UTC+12)
        run: TZ=Pacific/Auckland npm run test --workspace @tfc/core

  web:
    name: web · typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck (@tfc/web)
        run: npm run typecheck --workspace @tfc/web
      - name: Lint (@tfc/web)
        run: npm run lint --workspace @tfc/web
      # jsdom is a *root* devDependency, which looks misplaced: vitest hoists to
      # the root, and Node resolves an environment package from the runner's own
      # location, so a copy nested under apps/web is invisible to it. It used to
      # work by accident — jest-expo pulled jsdom@20 up to the root and vitest
      # silently used that instead of the version the web app declares.
      - name: Test (@tfc/web)
        run: npm run test --workspace @tfc/web
      - name: Build (@tfc/web)
        run: npm run build --workspace @tfc/web
